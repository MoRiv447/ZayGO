# 中断屏蔽预算清单（Interrupt-masking budget manifest）
#
# 这是 **声明**，不是证明。构建期检查的是"这些申报值 vs 允许上限"，
# 不检查实现里真有没有超——那要靠运行期实测（见 crit.rs 的 SITE_MAX）。
#
# 为什么需要它：实验 02 测出最坏释放延迟与屏蔽时长 1:1 增长。
# 所以"这个固件最坏会延迟多久"= 全固件最长的那个临界区。
# 这个数必须是被写下来、被检查、被报告出来的，而不是散落在代码注释里。

[budget]
# 允许的最长中断屏蔽时长（CPU 周期）。
#
# 取值依据：实时任务周期 64000 周期（1ms @64MHz），实验 02 的斜率是 1:1，
# 所以屏蔽上限直接等于"该周期内可容忍的最坏延迟"。
# 这里取 800 周期 = 12.5us ≈ 周期的 1.25%。
max_mask_cycles = 800

# 超过上限时是让构建失败，还是只警告。
# 默认 true —— 一个"只警告"的预算检查和没有检查区别不大。
fail_on_violation = true


# ---------------------------------------------------------------------------
# 每个临界区申报一项。
#
# budget_cycles 写"我保证不超过多少周期"。
# exempt = true 表示这是测试夹具、故意超限，检查时跳过 ——
# 但豁免会出现在构建报告里，不会被悄悄忽略。
# ---------------------------------------------------------------------------

[[site]]
name = "sample_ring_push"
file = "src/measure.rs"
purpose = "把一条样本写入环形缓冲，写入过程不能被中断看到半成品"
budget_cycles = 120

[[site]]
name = "ctl_submit"
file = "src/ctl.rs"
purpose = "把一条控制请求塞进队列；消费者是实时任务，会在任意指令处抢占，索引必须互斥"
budget_cycles = 200

[[site]]
name = "sweep_mask_stimulus"
file = "src/load.rs"
purpose = "实验 02 的合成激励：故意屏蔽到 96000 周期以演示丢 tick"
# 97000：按 PRE(200)+M(96000)=96200 估的值被运行期实测推翻（实测 96912）。
# 多出的约 700 周期来自 crit::mask 的进出开销与回绕检测的轮询粒度。
# 这个数字应该照实测写，而不是照推导写 —— 推导漏项是常态。
budget_cycles = 97000
exempt = true
